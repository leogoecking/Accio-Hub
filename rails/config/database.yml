default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000
  pragmas:
    foreign_keys: true
    journal_mode: wal
    synchronous: full

development:
  <<: *default
  database: <%= ENV.fetch("ACCIO_DATABASE_PATH", "storage/development.sqlite3") %>

test:
  <<: *default
  database: <%= ENV.fetch("ACCIO_DATABASE_PATH", "storage/test.sqlite3") %>

production:
  <<: *default
  database: <%= ENV.fetch("ACCIO_DATABASE_PATH", "storage/production.sqlite3") %>
