version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/rails"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      ruby-nonmajor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-nonmajor:
        update-types: ["minor", "patch"]
